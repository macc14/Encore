name: Encore
options:
  bundleIdPrefix: com.macky
  deploymentTarget:
    iOS: "17.0"
targets:
  Encore:
    type: application
    platform: iOS
    sources: [Encore]
    dependencies:
      - target: EncoreWidget
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "Encore needs access to your camera to take concert flyer photos."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Encore needs access to your photo library to save and select concert flyers."
        DEVELOPMENT_ASSET_PATHS: '"Encore/Preview Content"'
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: Encore/Encore.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.macky.Encore

  EncoreWidget:
    type: app-extension
    platform: iOS
    sources: 
      - EncoreWidget
      - Encore/Models/Concert.swift
    info:
      path: EncoreWidget/Info.plist
      properties:
        CFBundleDisplayName: "Encore Widget"
        CFBundleShortVersionString: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.macky.Encore.EncoreWidget"
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: EncoreWidget/EncoreWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.macky.Encore
